# Deploys (spec §8–§9, ADR-0013). The backend (migrations and Edge Functions) goes to the Supabase project on every
# push to v2 or main. Jot goes to GitHub Pages on pushes to main only, after the backend.
#
# Owner setup (#2) provides the repository variable SUPABASE_PROJECT_REF and the secrets SUPABASE_ACCESS_TOKEN and
# SUPABASE_DB_PASSWORD. Until the variable is set, the backend job is skipped on v2; on main it fails instead.
# Function secrets (ELEVENLABS_API_KEY…) are set in the Supabase dashboard, never here.

name: Deploy

on:
  push:
    branches: [v2, main]

# One deploy at a time, in push order, and never cancelled half-way.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend:
    name: Backend (migrations and functions)
    if: vars.SUPABASE_PROJECT_REF != '' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check owner setup
        run: |
          for name in SUPABASE_PROJECT_REF SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::$name isn't set (owner setup, #2)"; exit 1; fi
          done
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: 3.3.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply new migrations
        run: supabase db push --remote --yes
      - name: Deploy the Edge Functions
        # verify_jwt per function comes from supabase/config.toml.
        run: supabase functions deploy --yes

  pages:
    name: Jot (GitHub Pages)
    if: github.ref == 'refs/heads/main'
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Refuse to publish an unconfigured Jot
        run: |
          if grep -qE 'your-project-ref|REPLACE_ME' app/config.js app/index.html; then
            echo "::error::app/config.js or the CSP in app/index.html still has a placeholder (owner setup, #2)"
            exit 1
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v5
