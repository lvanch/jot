<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jot</title>
  <meta name="description" content="Say it, it's in your Inbox. One-tap voice capture for your to-do Inbox.">
  <meta name="theme-color" content="#f5f5f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e0e0e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <!-- supabase-js, vendored (see vendor/README.md). Classic script: defines window.supabase before main.js runs. -->
  <script src="vendor/supabase.js" defer></script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <header class="bar">
    <h1 class="brand">Jot</h1>
    <button id="account" class="account" type="button" aria-label="Account" aria-haspopup="true" aria-expanded="false" aria-controls="account-menu" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
    </button>
  </header>
  <div id="account-menu" class="menu" role="menu" hidden>
    <p id="account-email" class="menu-email"></p>
    <button id="sign-out" class="menu-item" type="button" role="menuitem">Sign out</button>
  </div>

  <main>
    <section id="signin" class="signin" aria-labelledby="signin-title" hidden>
      <h2 id="signin-title">Sign in to your Inbox</h2>
      <form id="email-form" novalidate>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required>
        <button class="primary" type="submit">Send code</button>
      </form>
      <form id="code-form" novalidate hidden>
        <p class="hint">Enter the code we emailed to <strong id="code-email"></strong>.</p>
        <label for="code">Code</label>
        <input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" maxlength="10" required>
        <button class="primary" type="submit">Sign in</button>
        <div class="links">
          <button id="resend" class="link" type="button">Send a new code</button>
          <button id="change-email" class="link" type="button">Use a different email</button>
        </div>
      </form>
      <p id="signin-error" class="error" role="alert"></p>
    </section>

    <section class="hero" aria-label="Capture">
      <button id="mic" class="mic" type="button" aria-label="Start listening" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/></svg>
      </button>
      <p id="status" class="status" aria-live="polite">Tap to speak</p>
      <button id="vocab-open" class="link vocab-open" type="button" hidden>Vocabulary</button>
    </section>

    <section id="recent" class="recent" aria-labelledby="recent-title" hidden>
      <h2 id="recent-title" class="recent-title">Recent</h2>
      <ul id="recent-list" class="recent-list"></ul>
    </section>

    <section id="vocabulary" class="vocab" aria-labelledby="vocab-title" hidden>
      <div class="vocab-head">
        <button id="vocab-back" class="back" type="button" aria-label="Back to the mic">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <h2 id="vocab-title" tabindex="-1">Vocabulary</h2>
        <span id="vocab-count" class="vocab-count" aria-live="polite"></span>
      </div>
      <p class="hint">Names and words Jot should spell your way. Sent with every Capture.</p>
      <form id="vocab-form" class="vocab-form" novalidate>
        <label for="vocab-term" class="sr-only">New term</label>
        <input id="vocab-term" name="term" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" placeholder="Add a name or word">
        <button id="vocab-add" class="primary" type="submit">Add</button>
      </form>
      <p id="vocab-error" class="error" role="alert"></p>
      <p id="vocab-note" class="vocab-note"></p>
      <button id="vocab-retry" class="link" type="button" hidden>Try again</button>
      <ul id="vocab-list" class="vocab-list"></ul>
    </section>
  </main>

  <button id="fab" class="fab" type="button" aria-label="Start listening" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3.5"/></svg>
  </button>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="undo" type="button">Undo</button>
  </div>
</body>
</html>
